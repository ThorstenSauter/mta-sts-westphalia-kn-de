name: Deploy to production environment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never cancelled: stopping a terraform apply part way can leave the state locked. PR plans stay
# out of this group on purpose and wait on the state lock (lock-timeout) instead: a third queued
# job in a shared group would cancel a pending deployment.
concurrency:
  group: terraform-state-production
  cancel-in-progress: false

jobs:
  apply-production:
    name: Apply production environment
    # x64: the module deploys with the Static Web Apps CLI, which has no arm64 build
    # (Azure/static-web-apps-cli#987).
    runs-on: ubuntu-26.04
    environment: production
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Terraform apply
        uses: ThorstenSauter/terraform-actions/apply@f4c5a856f2401bb96f67794d5761482fd759ed24 # v1.9.0
        with:
          infra-directory: ${{ vars.TF_WORKING_DIRECTORY }}
          resource-group: ${{ vars.TF_BACKEND_RESOURCE_GROUP_NAME }}
          storage-account: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT_NAME }}
          container: ${{ vars.TF_BACKEND_STATE_CONTAINER_NAME }}
          state-file: ${{ vars.TF_BACKEND_STATE_FILE_NAME }}
